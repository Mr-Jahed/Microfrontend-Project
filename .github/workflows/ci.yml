name: CI

on:
  push:
    branches: [dev-jahed, master]
  pull_request:
    branches: [master]

jobs:

  # ── Backend ────────────────────────────────────────────────
  backend:
    name: Backend — Django
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations (SQLite)
        run: python manage.py migrate
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          USE_POSTGRES: "False"

      - name: Seed data
        run: python manage.py seed_customers
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          USE_POSTGRES: "False"

  # ── customer-mf ────────────────────────────────────────────
  customer-mf:
    name: customer-mf — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-mf

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: customer-mf/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build

  # ── order-mf ───────────────────────────────────────────────
  order-mf:
    name: order-mf — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-mf

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: order-mf/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build

  # ── report-mf ──────────────────────────────────────────────
  report-mf:
    name: report-mf — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report-mf

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: report-mf/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build

  # ── host ───────────────────────────────────────────────────
  host:
    name: host — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: host/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build

  # ── Docker Compose Build ───────────────────────────────────
  docker:
    name: Docker Compose — Build All Images
    runs-on: ubuntu-latest
    needs: [backend, customer-mf, order-mf, report-mf, host]

    steps:
      - uses: actions/checkout@v4

      - name: Build all Docker images
        run: docker compose build
