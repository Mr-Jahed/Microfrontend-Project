services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - USE_POSTGRES=False
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/customers/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  customer-mf:
    build:
      context: .
      dockerfile: Dockerfile.customer-mf
    ports:
      - "3001:3001"

  order-mf:
    build:
      context: .
      dockerfile: Dockerfile.order-mf
    ports:
      - "3002:3002"

  report-mf:
    build:
      context: .
      dockerfile: Dockerfile.report-mf
    ports:
      - "3003:3003"

  host:
    build:
      context: .
      dockerfile: Dockerfile.host
    ports:
      - "3000:3000"
    depends_on:
      - customer-mf
      - order-mf
      - report-mf

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - host
      - backend
